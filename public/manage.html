<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your booking · Alderlux</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="band"><div class="wrap"><a class="wordmark" href="https://alderlux.com">ALDERLUX</a></div></header>
<main class="wrap" aria-live="polite">
  <p class="eyebrow">Your booking</p>
  <h1 id="title">Loading…</h1>
  <p class="chosen" id="when" hidden></p>
  <p id="where" class="muted"></p>
  <p id="actions" hidden>
    <a class="primary" id="ics" href="#">Add to calendar</a>
  </p>
  <p id="cancel-wrap" hidden><button class="link" id="cancel" type="button">Cancel this call</button></p>
  <p><a class="link" href="/">Book another time</a></p>
  <p class="error" id="error" role="alert"></p>
</main>
<footer class="wrap foot"><hr><p class="fine">Alderlux provides education and information only. We do not provide regulated financial advice, investment recommendations, legal or tax advice. Alderlux is not authorised by the Financial Conduct Authority.</p></footer>
<script src="/manage.js" defer></script>
</body>
</html>
